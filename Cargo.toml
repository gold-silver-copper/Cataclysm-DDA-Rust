[workspace]
resolver = "3"
members = [
    "crates/client",
    "crates/conformance",
    "crates/content",
    "crates/net",
    "crates/persistence",
    "crates/protocol",
    "crates/server",
    "crates/sim",
    "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "CC-BY-SA-3.0"
repository = "https://github.com/gold-silver-copper/Cataclysm-DDA-Rust"

[workspace.dependencies]
blake3 = "=1.8.5"
iroh = "=1.0.3"
libm = "=0.2.16"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
rand = "=0.10.2"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "=0.2.2"
zstd = { version = "=0.13.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 1
